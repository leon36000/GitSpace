[project]
name = "gitspace"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "harbor==0.21.0",
  "inspect-ai==0.3.258",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["harbor.*"]
ignore_missing_imports = true

[tool.gitspace]
uv-version = "0.12.0"
