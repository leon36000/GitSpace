name: Bootstrap Rust Toolchain

on:
  push:
    branches:
      - hermesclaw-ci
    paths:
      - .github/workflows/bootstrap-rust-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify and package standalone sysroot
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          sysroot="$(rustc --print sysroot)"
          base="$(dirname "$sysroot")"
          name="$(basename "$sysroot")"
          tar -C "$base" -czf rust-toolchain-1.97.1-linux-x86_64.tar.gz "$name"
          sha256sum rust-toolchain-1.97.1-linux-x86_64.tar.gz > rust-toolchain-1.97.1-linux-x86_64.tar.gz.sha256

      - name: Upload standalone toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-1.97.1-linux-x86_64
          path: |
            rust-toolchain-1.97.1-linux-x86_64.tar.gz
            rust-toolchain-1.97.1-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
