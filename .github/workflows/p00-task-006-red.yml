name: P00 Task 006 RED Contract

"on":
  pull_request:
    paths:
      - Cargo.toml
      - crates/gs-event-journal/**
      - .github/workflows/p00-task-006-red.yml
      - docs/phase-00/tasks/P00-TASK-006.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Select Rust 1.97.1
        run: rustup override set 1.97.1
      - name: Generate temporary RED lock graph
        run: cargo generate-lockfile
      - name: Observe missing Task 6 production API
        shell: bash
        run: |
          set +e
          cargo test -p gs-event-journal --test contract > task6-red.log 2>&1
          status=$?
          set -e
          cat task6-red.log
          test "$status" -ne 0
          grep -E "unresolved imports|no .*EventOffset.* in the root|could not find" task6-red.log
      - name: Verify RED branch contains no production implementation
        run: |
          test "$(grep -cv '^\s*\($\|//\|#!\)' crates/gs-event-journal/src/lib.rs)" -eq 0
