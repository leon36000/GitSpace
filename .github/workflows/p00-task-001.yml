name: P00 Task 001 Toolchain Contract
on:
  pull_request:
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - pyproject.toml
      - toolchains.lock.json
      - .gitignore
      - tests/contracts/test_toolchains.py
      - .github/workflows/p00-task-001.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.97.1
      - name: Verify Python
        run: python --version | grep -Fx 'Python 3.12.13'
      - name: Verify uv
        run: |
          uv --version
          python -c "import importlib.metadata as m; assert m.version('uv') == '0.12.0'"
      - name: Verify Rust
        run: |
          rustup show active-toolchain | grep -E '^1\.97\.1-'
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo --version | grep -E '^cargo 1\.97\.1 '
      - name: Contract tests
        run: python -m unittest -v tests/contracts/test_toolchains.py
      - name: Cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /tmp/gitspace-cargo-metadata.json
      - name: Clean repository
        run: test -z "$(git status --porcelain=v1)"
