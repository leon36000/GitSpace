name: P00 Task 011 Inspect Adapter

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - python/gs_eval_adapters/inspect_adapter.py
      - python/gs_eval_adapters/inspect_cleanup.py
      - python/gs_eval_adapters/inspect_replay.py
      - tests/adapters/inspect/**
      - docs/phase-00/qualifications/inspect-ai-0.3.258.json
      - docs/phase-00/tasks/P00-TASK-011.md
      - docs/phase-00/evidence/P00-TASK-011-*.md
      - .github/workflows/p00-task-011.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - python/gs_eval_adapters/inspect_adapter.py
      - python/gs_eval_adapters/inspect_cleanup.py
      - python/gs_eval_adapters/inspect_replay.py
      - tests/adapters/inspect/**
      - docs/phase-00/qualifications/inspect-ai-0.3.258.json
      - docs/phase-00/tasks/P00-TASK-011.md
      - docs/phase-00/evidence/P00-TASK-011-*.md
      - .github/workflows/p00-task-011.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact checked-out head
        run: git rev-parse HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install exact uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.0
      - name: Verify Python and uv identities
        run: |
          python --version | grep -Fx 'Python 3.12.13'
          python -c "import importlib.metadata as m; assert m.version('uv') == '0.12.0'"
      - name: Verify committed Inspect dependency graph
        run: uv lock --check --python 3.12.13
      - name: Sync frozen Python environment without build scripts
        run: uv sync --frozen --no-build
      - name: Verify exact qualified distributions
        run: |
          uv run --frozen --no-build python -c "import importlib.metadata as m; assert m.version('inspect-ai') == '0.3.258'"
          uv run --frozen --no-build python -c "import importlib.metadata as m; assert m.version('jsonschema') == '4.26.0'"
      - name: Test Inspect adapter contract
        run: PYTHONPATH=python:tests/adapters/inspect uv run --frozen --no-build python -m unittest discover -s tests/adapters/inspect -p 'test_*.py' -v
      - name: Kill critical Inspect adapter mutations
        run: PYTHONPATH=python:tests/adapters/inspect uv run --frozen --no-build python tests/adapters/inspect/run_mutations.py
      - name: Replay provider-neutral SDK contract
        run: PYTHONPATH=python:tests/adapters uv run --frozen --no-build python -m unittest discover -s tests/adapters -p 'test_*.py' -v
      - name: Compile Python adapter boundary
        run: PYTHONPATH=python uv run --frozen --no-build python -m compileall -q python/gs_eval_adapters tests/adapters/inspect
      - name: Replay Python toolchain contract
        run: uv run --frozen --no-build python -m unittest -v tests/contracts/test_toolchains.py
      - name: Replay sovereign schema contract
        run: uv run --frozen --no-build python -m unittest -v tests/contracts/test_eval_ir_schemas.py
      - name: Replay Task 11 from a clean archive
        shell: bash
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          (
            cd "$archive_dir"
            uv lock --check --python 3.12.13
            uv sync --frozen --no-build
            uv run --frozen --no-build python -c "import importlib.metadata as m; assert m.version('inspect-ai') == '0.3.258'"
            PYTHONPATH=python:tests/adapters/inspect uv run --frozen --no-build python -m unittest discover -s tests/adapters/inspect -p 'test_*.py' -v
            PYTHONPATH=python:tests/adapters uv run --frozen --no-build python -m unittest discover -s tests/adapters -p 'test_*.py' -v
            PYTHONPATH=python uv run --frozen --no-build python -m compileall -q python/gs_eval_adapters tests/adapters/inspect
            uv run --frozen --no-build python -m unittest -v tests/contracts/test_toolchains.py
            uv run --frozen --no-build python -m unittest -v tests/contracts/test_eval_ir_schemas.py
          )
          rm -rf "$archive_dir"
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.97.1
      - name: Verify locked Rust graph
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/gitspace-cargo-metadata.json
      - name: Test complete Rust workspace
        run: cargo test --locked --workspace --all-targets
      - name: Clippy complete Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify repository clean
        run: test -z "$(git status --porcelain=v1)"
      - name: Verify SonarCloud quality gate for exact pull request head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SONAR_PROJECT: leon36000_GitSpace
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          head = os.environ["EXACT_HEAD"]
          pull_request = os.environ["PR_NUMBER"]
          project = os.environ["SONAR_PROJECT"]
          token = os.environ["GH_TOKEN"]

          def get_json(url: str, *, github: bool = False) -> dict[str, object]:
              headers = {
                  "Accept": "application/vnd.github+json" if github else "application/json",
                  "User-Agent": "gitspace-task-011-evidence",
              }
              if github:
                  headers["Authorization"] = f"Bearer {token}"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          checks_url = (
              f"https://api.github.com/repos/{repository}/commits/{head}/check-runs"
              "?check_name=SonarCloud%20Code%20Analysis&per_page=100"
          )
          sonar_check: dict[str, object] | None = None
          for _ in range(30):
              payload = get_json(checks_url, github=True)
              candidates = [
                  item
                  for item in payload.get("check_runs", [])
                  if item.get("name") == "SonarCloud Code Analysis"
                  and item.get("head_sha") == head
              ]
              if candidates and candidates[-1].get("status") == "completed":
                  sonar_check = candidates[-1]
                  break
              time.sleep(10)

          if sonar_check is None:
              raise SystemExit("SonarCloud did not complete an exact-head check")

          check_summary = {
              "id": sonar_check.get("id"),
              "head_sha": sonar_check.get("head_sha"),
              "status": sonar_check.get("status"),
              "conclusion": sonar_check.get("conclusion"),
              "annotations_count": sonar_check.get("output", {}).get("annotations_count"),
          }
          print("SONAR_CHECK=" + json.dumps(check_summary, sort_keys=True))

          quality_query = urllib.parse.urlencode(
              {"projectKey": project, "pullRequest": pull_request}
          )
          issues_query = urllib.parse.urlencode(
              {
                  "componentKeys": project,
                  "pullRequest": pull_request,
                  "resolved": "false",
                  "ps": "100",
              }
          )
          quality = get_json(
              "https://sonarcloud.io/api/qualitygates/project_status?" + quality_query
          )
          issues = get_json("https://sonarcloud.io/api/issues/search?" + issues_query)
          status = quality.get("projectStatus", {}).get("status")
          issue_total = issues.get("total")
          issue_keys = [item.get("key") for item in issues.get("issues", [])]
          print("SONAR_QUALITY_GATE=" + json.dumps(quality, sort_keys=True))
          print(
              "SONAR_OPEN_ISSUES="
              + json.dumps({"total": issue_total, "keys": issue_keys}, sort_keys=True)
          )

          if sonar_check.get("conclusion") != "success":
              raise SystemExit("SonarCloud exact-head check did not succeed")
          if status != "OK":
              raise SystemExit(f"SonarCloud quality gate is {status!r}, expected 'OK'")
          if issue_total != 0:
              raise SystemExit(f"SonarCloud reports {issue_total!r} unresolved PR issues")
          PY
