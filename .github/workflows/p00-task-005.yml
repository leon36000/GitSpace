name: P00 Task 005 Local CAS

"on":
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/gs-cas/**
      - .github/workflows/p00-task-005.yml
      - docs/phase-00/tasks/P00-TASK-005.md
      - docs/phase-00/evidence/P00-TASK-005-*.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/p00-task-005-green
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Select Rust
        run: rustup override set 1.97.1
      - name: Verify Task 5
        run: bash crates/gs-cas/ci.sh
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Task 5 dependency graph"
          git push origin HEAD:agent/p00-task-005-green
