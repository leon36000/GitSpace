name: P00 Task 005 Local CAS

"on":
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/gs-cas/**
      - .github/workflows/p00-task-005.yml
      - docs/phase-00/tasks/P00-TASK-005.md
      - docs/phase-00/evidence/P00-TASK-005-*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Select Rust
        run: rustup override set 1.97.1
      - name: Verify Task 5
        run: bash crates/gs-cas/ci.sh
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p00-task-005-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
