name: P00 Task 005 Local CAS

"on":
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/gs-cas/**
      - .github/workflows/p00-task-005.yml
      - docs/phase-00/tasks/P00-TASK-005.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Select Rust
        run: rustup override set 1.97.1
      - name: Verify Rust
        run: rustc --version
      - name: Contract test
        run: cargo test -p gs-cas --test contract
