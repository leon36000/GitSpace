name: Bootstrap Tauri Debian Sysroot

on:
  push:
    branches:
      - hermesclaw-ci
    paths:
      - .github/workflows/bootstrap-tauri-debian-sysroot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-sysroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download Debian Trixie packages and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debs/partial
          docker run --rm \
            -v "$PWD/debs:/out" \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              mkdir -p /out/partial
              apt-get \
                -o Dir::Cache::archives=/out \
                -o APT::Install-Recommends=false \
                -o APT::Install-Suggests=false \
                --download-only -y install \
                  libwebkit2gtk-4.1-dev \
                  libgtk-3-dev \
                  libayatana-appindicator3-dev \
                  librsvg2-dev \
                  libxdo-dev \
                  libssl-dev \
                  patchelf
              rm -f /out/lock
              rm -rf /out/partial
            '
          test -n "$(find debs -maxdepth 1 -name '*.deb' -print -quit)"
          sha256sum debs/*.deb > tauri-debian-trixie-debs.sha256
          printf 'package_count=%s\n' "$(find debs -maxdepth 1 -name '*.deb' | wc -l)"
          du -sh debs

      - name: Upload Debian sysroot packages
        uses: actions/upload-artifact@v4
        with:
          name: tauri-debian-trixie-sysroot-debs
          path: |
            debs/*.deb
            tauri-debian-trixie-debs.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
