name: P00 Task 004 Evaluation IR Parity

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/gs-eval-ir/**
      - tests/contracts/eval_ir_parity.json
      - tests/contracts/test_eval_ir_parity.py
      - .github/workflows/p00-task-004.yml
      - docs/phase-00/tasks/P00-TASK-004.md
      - docs/phase-00/evidence/P00-TASK-004-VERDICT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install Python schema validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Verify Python validator identity
        run: python -c "import importlib.metadata as m; assert m.version('jsonschema') == '4.26.0'"
      - name: Validate canonical schemas
        run: python -m unittest -v tests/contracts/test_eval_ir_schemas.py
      - name: Validate shared corpus with Python
        run: python -m unittest -v tests/contracts/test_eval_ir_parity.py
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.97.1
      - name: Verify Rust identity
        run: |
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo --version | grep -E '^cargo 1\.97\.1 '
      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/gitspace-cargo-metadata.json
      - name: Test shared corpus with Rust
        run: cargo test --locked -p gs-eval-ir --all-targets
      - name: Clippy
        run: cargo clippy --locked -p gs-eval-ir --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Verify repository clean
        run: test -z "$(git status --porcelain=v1)"
