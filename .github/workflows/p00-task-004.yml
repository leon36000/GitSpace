name: P00 Task 004 Evaluation IR Rust Parity

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/gs-eval-ir/**"
      - "schemas/v1/**"
      - "tests/contracts/eval-ir/**"
      - ".github/workflows/p00-task-004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.0"

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1

      - name: Python schema baseline
        run: uv run --frozen python tests/contracts/eval-ir/validate_shared_corpus.py

      - name: Rust shared-corpus parity
        run: cargo test -p gs-eval-ir

      - name: Clippy
        run: cargo clippy -p gs-eval-ir --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Repository clean
        run: git diff --exit-code
