name: P00 Task 002 Evaluation IR Schemas

on:
  pull_request:
    paths:
      - schemas/v1/**
      - tests/contracts/test_eval_ir_schemas.py
      - .github/workflows/p00-task-002.yml
      - docs/phase-00/tasks/P00-TASK-002.md
      - docs/phase-00/evidence/P00-TASK-002-VERDICT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Verify validator identity
        run: python -c "import importlib.metadata as m; assert m.version('jsonschema') == '4.26.0'"
      - name: Validate Evaluation IR v1 contracts
        run: python -m unittest -v tests/contracts/test_eval_ir_schemas.py
      - name: Verify repository clean
        run: test -z "$(git status --porcelain=v1)"
