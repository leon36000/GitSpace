name: P00 Task 003 Canonical JSON

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/gs-canonical-json/**
      - .github/workflows/p00-task-003.yml
      - docs/phase-00/tasks/P00-TASK-003.md
      - docs/phase-00/evidence/P00-TASK-003-VERDICT.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.97.1
      - name: Verify Rust identity
        run: rustc --version | grep -E '^rustc 1\.97\.1 '
      - name: Test canonical JSON crate
        run: cargo test -p gs-canonical-json --all-targets
      - name: Print generated Cargo.lock
        run: cat Cargo.lock
      - name: Clippy
        run: cargo clippy -p gs-canonical-json --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
