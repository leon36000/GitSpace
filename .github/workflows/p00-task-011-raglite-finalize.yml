name: P00 Task 011 RAGLite Finalize

on:
  pull_request:
    paths:
      - .github/workflows/p00-task-011-raglite-finalize.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  project-and-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Generate exact projection from signed canonical state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          source_commit="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD^)" = "${source_commit}"
          grep -F 'P00-TASK-011 : `PROVEN`' 02_GITSPACE_NOW_DECISIONS_ROADMAP.md
          grep -F 'next_task: P00-TASK-012' 02_GITSPACE_NOW_DECISIONS_ROADMAP.md
          grep -F 'active_task: P00-TASK-012' 04_GITSPACE_AGENT_PROTOCOL.md

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          commit_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/commits/${source_commit}")"
          test "$(jq -er '.verification.verified' <<<"${commit_json}")" = true
          test "$(jq -er '.verification.reason' <<<"${commit_json}")" = valid
          source_tree="$(jq -er '.tree.sha' <<<"${commit_json}")"

          mkdir -p raglite/mobile
          for file in 00_GITSPACE_START_HERE.md 01_GITSPACE_MASTER_CANON.md 02_GITSPACE_NOW_DECISIONS_ROADMAP.md 03_GITSPACE_RESEARCH_ATLAS.md 04_GITSPACE_AGENT_PROTOCOL.md; do
            cp -- "${file}" "raglite/mobile/${file}"
          done

          blob00="$(git rev-parse "${source_commit}:00_GITSPACE_START_HERE.md")"
          blob01="$(git rev-parse "${source_commit}:01_GITSPACE_MASTER_CANON.md")"
          blob02="$(git rev-parse "${source_commit}:02_GITSPACE_NOW_DECISIONS_ROADMAP.md")"
          blob03="$(git rev-parse "${source_commit}:03_GITSPACE_RESEARCH_ATLAS.md")"
          blob04="$(git rev-parse "${source_commit}:04_GITSPACE_AGENT_PROTOCOL.md")"

          cat > raglite/RAGLITE-MANIFEST.yaml <<EOF
          manifest_version: 0.4.12
          source_commit: ${source_commit}
          source_tree: ${source_tree}
          projection:
            00_GITSPACE_START_HERE.md: ${blob00}
            01_GITSPACE_MASTER_CANON.md: ${blob01}
            02_GITSPACE_NOW_DECISIONS_ROADMAP.md: ${blob02}
            03_GITSPACE_RESEARCH_ATLAS.md: ${blob03}
            04_GITSPACE_AGENT_PROTOCOL.md: ${blob04}
          EOF

          for file in 00_GITSPACE_START_HERE.md 01_GITSPACE_MASTER_CANON.md 02_GITSPACE_NOW_DECISIONS_ROADMAP.md 03_GITSPACE_RESEARCH_ATLAS.md 04_GITSPACE_AGENT_PROTOCOL.md; do
            cmp --silent "${file}" "raglite/mobile/${file}"
          done

          git rm .github/workflows/p00-task-011-raglite-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raglite/RAGLITE-MANIFEST.yaml raglite/mobile
          git commit -m "docs(raglite): project proven Task 11 state"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

      - name: Verify final blobs and merge projection PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '51' }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          final_sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 30); do
            remote_sha="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls/${PR_NUMBER}" | jq -er '.head.sha')"
            test "${remote_sha}" = "${final_sha}" && break
            sleep 2
          done
          test "${remote_sha}" = "${final_sha}"

          source_commit="$(awk '$1 == "source_commit:" {print $2}' raglite/RAGLITE-MANIFEST.yaml)"
          source_tree="$(awk '$1 == "source_tree:" {print $2}' raglite/RAGLITE-MANIFEST.yaml)"
          test "${source_commit}" = "$(git rev-parse origin/main)"
          test "${source_tree}" = "$(git rev-parse "${source_commit}^{tree}")"

          for file in 00_GITSPACE_START_HERE.md 01_GITSPACE_MASTER_CANON.md 02_GITSPACE_NOW_DECISIONS_ROADMAP.md 03_GITSPACE_RESEARCH_ATLAS.md 04_GITSPACE_AGENT_PROTOCOL.md; do
            cmp --silent "${file}" "raglite/mobile/${file}"
            manifest_blob="$(awk -v name="${file}" '$1 == name":" {print $2}' raglite/RAGLITE-MANIFEST.yaml)"
            test "${manifest_blob}" = "$(git rev-parse "${source_commit}:${file}")"
            test "${manifest_blob}" = "$(git hash-object "raglite/mobile/${file}")"
          done

          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            raglite/RAGLITE-MANIFEST.yaml
            raglite/mobile/00_GITSPACE_START_HERE.md
            raglite/mobile/02_GITSPACE_NOW_DECISIONS_ROADMAP.md
            raglite/mobile/04_GITSPACE_AGENT_PROTOCOL.md
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

          payload="$(jq -n --arg sha "${final_sha}" '{merge_method:"squash",sha:$sha,commit_title:"docs: project proven Task 11 state into RAGLite",commit_message:"Bind the mobile RAGLite projection to the signed Task 11 state merge and reuse the exact five routed source blobs."}')"
          response="$(curl --fail --silent --show-error -X PUT "${auth[@]}" "${api}/pulls/${PR_NUMBER}/merge" --data "${payload}")"
          jq -e '.merged == true' <<<"${response}"
