name: P00 Task 011 State Bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/p00-task-011-state-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Generate state only from signed post-merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: 0d55958ae2527f91cde0f27fb7cb2c2abceb3bff
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          commit_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/commits/${MERGE_SHA}")"
          tree_sha="$(jq -er '.tree.sha' <<<"${commit_json}")"
          parent_sha="$(jq -er '.parents | length == 1 and .[0].sha' <<<"${commit_json}")"
          verified="$(jq -er '.verification.verified' <<<"${commit_json}")"
          verify_reason="$(jq -er '.verification.reason' <<<"${commit_json}")"
          verified_at="$(jq -er '.verification.verified_at' <<<"${commit_json}")"
          test "${verified}" = true
          test "${verify_reason}" = valid
          test "${parent_sha}" = e082cf941d865d71347feae475e4a8e43aeab5e2
          test "$(git rev-parse HEAD)" = "${MERGE_SHA}"

          runs_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs?head_sha=${MERGE_SHA}&event=push&per_page=100")"
          run_id="$(jq -er '[.workflow_runs[] | select(.name == "P00 Task 011 Inspect Adapter" and .head_sha == env.MERGE_SHA and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.id) | last | .id' <<<"${runs_json}")"
          jobs_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")"
          job_id="$(jq -er '[.jobs[] | select(.name == "verify" and .status == "completed" and .conclusion == "success")] | if length == 1 then .[0].id else error("expected one successful verify job") end' <<<"${jobs_json}")"
          hermes_sha="$(curl --fail --silent --show-error "${auth[@]}" "${api}/branches/hermesclaw-ci" | jq -er '.commit.sha')"
          test "${hermes_sha}" = 91f55525b231116fd431430f46c87667e5c1f140

          export MERGE_SHA="$MERGE_SHA" TREE_SHA="$tree_sha" PARENT_SHA="$parent_sha" VERIFIED_AT="$verified_at" RUN_ID="$run_id" JOB_ID="$job_id" HERMES_SHA="$hermes_sha"
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          merge = os.environ["MERGE_SHA"]
          tree = os.environ["TREE_SHA"]
          parent = os.environ["PARENT_SHA"]
          verified_at = os.environ["VERIFIED_AT"]
          run = os.environ["RUN_ID"]
          job = os.environ["JOB_ID"]
          hermes = os.environ["HERMES_SHA"]

          Path("docs/phase-00/evidence/P00-TASK-011-POSTMERGE.md").write_text(f'''---
          evidence_id: P00-TASK-011-POSTMERGE
          status: PROVEN_BOUNDED_CONTRACT
          recorded_at: 2026-08-14
          implementation_pr: 49
          merge_commit: {merge}
          merge_tree: {tree}
          base_commit: {parent}
          postmerge_workflow_run: {run}
          postmerge_workflow_job: {job}
          identity_independent_review: false
          ---
          # P00-TASK-011 — Preuve post-merge

          ## Verdict utile

          `P00-TASK-011 = PROVEN` dans son contrat borné de fixture Inspect AI 0.3.258.

          La Phase 00 et le milestone M0 restent `PARTIALLY_VERIFIED`. Cette promotion ne qualifie ni Inspect en général, ni un fournisseur de modèle externe, et ne remplace pas une revue indépendante par identité.

          ## Merge signé

          ```yaml
          merge_commit: {merge}
          parent: {parent}
          tree: {tree}
          verification:
            verified: true
            reason: valid
            verified_at: {verified_at}
          ```

          Le merge exact est la tête produit de `main`. `hermesclaw-ci` reste intacte à `{hermes}`.

          ## Replay frais sur main

          ```yaml
          workflow: P00 Task 011 Inspect Adapter
          run: {run}
          job: {job}
          head: {merge}
          event: push
          checkout: detached_exact_head
          permissions:
            contents: read
          conclusion: success
          ```

          Le workflow post-merge a reproduit depuis les locks committés :

          - Python 3.12.13, uv 0.12.0, Inspect AI 0.3.258 et jsonschema 4.26.0;
          - le vrai run local `mockllm/model`, un Task, un Sample et une epoch;
          - réseau bloqué, mapping version/commit/model/solver/scorer fermé;
          - wrapper runtime officiel exact `EvalLogs`, cardinalité un et élément exact `EvalLog`;
          - log complet et record sous URI CAS correspondant aux bytes;
          - projection du log complet et replay exact-match sans import Inspect;
          - fermeture du receiver AnyIO abandonné par la release pinée et restauration du shim après succès ou exception;
          - 24/24 mutations critiques tuées;
          - suite provider-neutral Task 10 complète;
          - schémas souverains offline et contrat toolchain;
          - replay depuis `git archive HEAD` sans métadonnées Git;
          - workspace Rust complet verrouillé, Clippy `-D warnings`, rustfmt et dépôt propre.

          ## Contrat prouvé

          ```text
          EvalTaskSpec + AgentConfiguration validés
          → mapping Inspect fermé
          → Task/Sample en mémoire
          → mockllm/model
          → generate
          → match exact
          → EvalLog JSON complet
          → log et record CAS
          → projection et rescoring sans Inspect
          ```

          Propriétés couvertes :

          1. La release, le commit source, le wheel et le sdist sont pinés et concordent avec `uv.lock`.
          2. Task 10 valide le canon avant le premier accès Inspect.
          3. Aucun provider, endpoint, secret, socket, tool, agent ou sandbox externe ne participe.
          4. Les types runtime acceptés sont bornés à `list` builtin ou au wrapper officiel exact `EvalLogs`, avec un unique `EvalLog` exact.
          5. Le log complet est projeté dans un module qui n’importe pas Inspect.
          6. Le log et le record sont liés par SHA-256 à leurs URI CAS.
          7. Le record et le résultat replay sont fermés et revalidés après mutation.
          8. Le score Inspect doit être reproduit par le scorer exact-match indépendant; une divergence échoue fermée.
          9. Les états `error` ou `cancelled` sont INFRA et ne deviennent pas un échec agent.
          10. L’ordre des événements participe au digest du record.
          11. Le receiver AnyIO laissé ouvert par Inspect 0.3.258 est fermé par un shim temporaire, sérialisé et restauré.
          12. Le workflow final et le replay sont strictement en lecture seule.

          ## Mémoire négative conservée

          - harness RED échouant avant le seam faute de dépendance Task 10;
          - fixture Evaluation IR invalide;
          - dataclass tentant de franchir la frontière JSON;
          - score indépendant masqué lors d’un désaccord;
          - wrapper runtime `EvalLogs` non couvert par l’annotation publique;
          - URI record non liée aux bytes;
          - mutation post-construction non revalidée;
          - bool accepté comme entier de projection;
          - résultat replay directement constructible avec état invalide;
          - projection du log complet absente du module Inspect-free;
          - receiver AnyIO abandonné par la release pinée;
          - premier shim fondé sur des symboles privés inexistants.

          ## Limites et risques résiduels

          - `LIMIT` — une seule fixture Inspect 0.3.258, pas le framework complet.
          - `LIMIT` — API privée utilisée sous pin exact; chaque future release exige suppression ou requalification du shim.
          - `LIMIT` — aucun appel direct concurrent à Inspect hors lock GitSpace n’est qualifié.
          - `LIMIT` — aucun modèle/provider externe, réseau, tool, agent, sandbox ou scorer model-graded.
          - `LIMIT` — le sink injecté est vérifié par digest mais le stockage durable est hors scope.
          - `LIMIT` — le replay indépendant couvre uniquement le sous-ensemble exact-match qualifié.
          - `BLOCKED` — aucune reproduction par une identité de reviewer séparée.

          ## Décision

          Task 11 est `PROVEN` uniquement dans la frontière bornée ci-dessus. La Phase 00 et M0 restent `PARTIALLY_VERIFIED`.

          Task 12 peut être packetisée seulement après fusion de cette promotion d’état et de sa projection RAGLite byte-identical.
          ''', encoding="utf-8")

          Path("00_GITSPACE_START_HERE.md").write_text(f'''---
