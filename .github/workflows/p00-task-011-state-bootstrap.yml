          - Un shim privé n’est acceptable que sous pin exact, tests négatifs et obligation de requalification à chaque release.
          - Faux `DONE = 0`.

          ## État

          `P00-TASK-001` à `P00-TASK-011` sont fusionnées et prouvées dans leurs contrats bornés.

          Task 11 qualifie une seule fixture Inspect AI 0.3.258 : un Task, un Sample, `mockllm/model`, `generate`, scorer `match` exact, log et record CAS, projection et rescoring sans import Inspect. Le receiver AnyIO abandonné par la release pinée est fermé par un shim temporaire et restauré, lui-même couvert par tests et mutations.

          Son merge GitHub signé est `{merge}`; la reproduction post-merge fraîche est le run `{run}`, job `{job}`.

          Task 11 est `PROVEN` dans cette frontière bornée. Le milestone M0 et la Phase 00 restent `PARTIALLY_VERIFIED`, notamment parce qu’aucune reproduction par une identité de reviewer séparée n’est enregistrée et qu’aucun modèle/provider externe n’est qualifié.

          La prochaine unité est `P00-TASK-012` : adaptateur Harbor / Terminal-Bench, mapping Evaluation IR, artefacts CAS et replay indépendant du framework.
          ''', encoding="utf-8")

          Path("02_GITSPACE_NOW_DECISIONS_ROADMAP.md").write_text(f'''---
