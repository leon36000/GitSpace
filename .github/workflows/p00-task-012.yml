name: P00 Task 012 Harbor Adapter

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - python/gs_eval_adapters/harbor_adapter.py
      - python/gs_eval_adapters/harbor_replay.py
      - python/gs_eval_adapters/harbor_runtime.py
      - tests/adapters/harbor/**
      - docs/phase-00/qualifications/harbor-0.21.0.json
      - docs/phase-00/qualifications/terminal-bench-2.1-regex-log.json
      - .github/workflows/p00-task-012.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - python/gs_eval_adapters/harbor_adapter.py
      - python/gs_eval_adapters/harbor_replay.py
      - python/gs_eval_adapters/harbor_runtime.py
      - tests/adapters/harbor/**
      - docs/phase-00/qualifications/harbor-0.21.0.json
      - docs/phase-00/qualifications/terminal-bench-2.1-regex-log.json
      - .github/workflows/p00-task-012.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact checked-out head
        run: git rev-parse HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install exact uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.0
      - name: Verify exact toolchain and locked graph
        run: |
          python --version | grep -Fx 'Python 3.12.13'
          python -c "import importlib.metadata as m; assert m.version('uv') == '0.12.0'"
          uv lock --check --python 3.12.13
      - name: Sync frozen graph without building the project
        run: uv sync --frozen --no-build
      - name: Verify pinned Harbor distribution and implementation constants
        run: |
          uv run --frozen --no-build python -c "import importlib.metadata as m; assert m.version('harbor') == '0.21.0'"
          PYTHONPATH=python uv run --frozen --no-build python -c "from gs_eval_adapters.harbor_replay import HARBOR_VERSION, HARBOR_COMMIT, HARBOR_WHEEL_SHA256; assert (HARBOR_VERSION, HARBOR_COMMIT, HARBOR_WHEEL_SHA256) == ('0.21.0', '64afbbcb62165950301e1a6407c729aa26d844ff', 'c77d779a03f1a9e8ecb3c449e17f39a9728b82238832f1fd28632eb9426c0a21')"
      - name: Verify normalized offline Terminal-Bench fixture
        run: PYTHONPATH=python:tests/adapters:tests/adapters/harbor uv run --frozen --no-build python -m unittest tests.adapters.harbor.test_fixture_normalization -v
      - name: Test normalized offline verifier directly
        run: PYTHONPATH=python:tests/adapters:tests/adapters/harbor uv run --frozen --no-build python -m unittest tests.adapters.harbor.test_normalized_verifier -v
      - name: Test Harbor adapter, executor seam, and provider-neutral replay
        run: PYTHONPATH=python:tests/adapters:tests/adapters/harbor uv run --frozen --no-build python -m unittest discover -s tests/adapters/harbor -p 'test_harbor_*.py' -v
      - name: Run Harbor mutation suite
        run: PYTHONPATH=python:tests/adapters:tests/adapters/harbor uv run --frozen --no-build python tests/adapters/harbor/run_mutations.py
      - name: Test complete provider-neutral adapter suite
        run: PYTHONPATH=python uv run --frozen --no-build python -m unittest discover -s tests/adapters -p 'test_*.py' -v
      - name: Compile adapter boundary
        run: PYTHONPATH=python uv run --frozen --no-build python -m compileall -q python/gs_eval_adapters tests/adapters/harbor
      - name: Validate Harbor CLI is installed without starting a job
        run: uv run --frozen --no-build harbor run --help >/dev/null
      # Docker/Harbor runtime qualification is intentionally absent here. The
      # project contract requires a dedicated qualified worker and an external
      # resource/egress evidence review before any real oracle run.
